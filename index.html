<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Koine Vocabulary</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#EFE7D3" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#191713" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Koine Vocab" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<style>
  :root {
    color-scheme: light dark;
    --paper: #EFE7D3;
    --paper-2: #F8F3E6;
    --edge: #D5C7A4;
    --ink: #2E2820;
    --ink-soft: #6E6250;
    --accent: #7C3A2E;
    --gold: #A98A४3;
    --gold: #A98A43;
    --good: #4C6340;
    --good-bg: #E2EAD9;
    --bad: #8A3A33;
    --bad-bg: #F2DFDB;
    --shadow: rgba(46,40,32,0.16);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #191713;
      --paper-2: #23201A;
      --edge: #3C362C;
      --ink: #EDE5D4;
      --ink-soft: #A2977F;
      --accent: #D08A78;
      --gold: #C6A55C;
      --good: #A8C795;
      --good-bg: #2A3324;
      --bad: #E0A099;
      --bad-bg: #3A2623;
      --shadow: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #191713;
    --paper-2: #23201A;
    --edge: #3C362C;
    --ink: #EDE5D4;
    --ink-soft: #A2977F;
    --accent: #D08A78;
    --gold: #C6A55C;
    --good: #A8C795;
    --good-bg: #2A3324;
    --bad: #E0A099;
    --bad-bg: #3A2623;
    --shadow: rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 18px 16px 28px;
  }

  /* ---- header ---- */
  header {
    text-align: center;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--edge);
    margin-bottom: 18px;
    position: relative;
  }
  header h1 {
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
  }
  header .sub {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 3px;
  }
  .back {
    position: absolute;
    left: 0; top: 0;
    background: none; border: none;
    color: var(--ink-soft);
    font-family: inherit; font-size: 20px;
    padding: 0 8px 0 0;
    cursor: pointer; line-height: 1;
  }

  /* ---- deck list ---- */
  .deck {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--paper-2);
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 14px 16px;
    margin-bottom: 10px;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .deck:active { transform: translateY(1px); }
  .deck .dt { font-size: 16px; margin-bottom: 3px; }
  .deck .dm { font-size: 12px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 10px; }
  .bar {
    height: 3px;
    background: var(--edge);
    border-radius: 2px;
    margin-top: 9px;
    overflow: hidden;
  }
  .bar > i { display: block; height: 100%; background: var(--gold); width: 0%; }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 22px 0 10px;
  }

  /* ---- study screen ---- */
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .scene { perspective: 1200px; margin-bottom: 16px; }
  .card {
    position: relative;
    width: 100%;
    min-height: 280px;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,.2,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--paper-2);
    border: 1px solid var(--edge);
    border-radius: 4px;
    box-shadow: 0 2px 8px var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 26px 22px;
    overflow-y: auto;
  }
  .face.back { transform: rotateY(180deg); }
  .greek {
    font-size: 38px;
    line-height: 1.25;
    margin-bottom: 8px;
    word-break: break-word;
  }
  .lexform { font-size: 14px; color: var(--ink-soft); }
  .tapnote {
    position: absolute;
    bottom: 12px; left: 0; right: 0;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.7;
  }
  .def { font-size: 22px; line-height: 1.45; }
  .pp { font-size: 14px; line-height: 1.5; color: var(--ink-soft); margin-top: 10px; max-width: 340px; }
  .note {
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 14px;
    border-top: 1px solid var(--edge);
    padding-top: 12px;
    max-width: 340px;
  }
  .freq {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-top: 10px;
  }
  .hintbtn {
    background: none;
    border: 1px solid var(--edge);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    margin-top: 16px;
    cursor: pointer;
  }
  .hinttext { font-size: 13px; font-style: italic; color: var(--ink-soft); margin-top: 14px; max-width: 320px; }

  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    padding: 13px 10px;
    border-radius: 3px;
    border: 1px solid var(--edge);
    background: var(--paper-2);
    color: var(--ink);
    cursor: pointer;
  }
  .btn:active { transform: translateY(1px); }
  .btn.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .btn.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .btn.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .toolbar {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 18px;
    font-size: 12px;
  }
  .toolbar button {
    background: none; border: none;
    color: var(--ink-soft);
    font-family: inherit; font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 4px;
  }

  /* ---- overall progress ---- */
  .overall {
    background: var(--paper-2);
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 16px 18px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .overall .ot {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .overall .orow {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .overall .opct { font-size: 26px; }
  .overall .owords { font-size: 12px; color: var(--ink-soft); text-align: right; }
  .overall .bar { height: 6px; margin-top: 4px; }

  /* ---- tabs ---- */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tabbtn {
    flex: 1;
    font-family: inherit;
    font-size: 13px;
    padding: 9px 8px;
    border-radius: 3px;
    border: 1px solid var(--edge);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tabbtn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ---- charts ---- */
  .chart-block { margin-bottom: 28px; }
  .chart-title {
    font-size: 15px;
    margin-bottom: 3px;
  }
  .chart-note {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    margin-bottom: 10px;
  }
  table.paradigm {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    background: var(--paper-2);
    border: 1px solid var(--edge);
  }
  table.paradigm th, table.paradigm td {
    border: 1px solid var(--edge);
    padding: 7px 8px;
    text-align: center;
  }
  table.paradigm th {
    font-style: italic;
    font-weight: 400;
    color: var(--ink-soft);
    font-size: 12px;
    background: rgba(0,0,0,0.02);
  }
  table.paradigm td.rowlabel, table.paradigm th.rowlabel {
    text-align: left;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 12px;
    white-space: nowrap;
  }
  table.paradigm .greekcell { font-size: 16px; }

  /* ---- search ---- */
  .searchbox { position: relative; margin-bottom: 16px; }
  .searchbox input {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    padding: 11px 40px 11px 12px;
    border: 1px solid var(--edge);
    border-radius: 3px;
    background: var(--paper-2);
    color: var(--ink);
    -webkit-appearance: none;
    appearance: none;
  }
  .searchbox input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .searchbox .sclear {
    position: absolute; right: 2px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--ink-soft);
    font-size: 22px; line-height: 1;
    padding: 6px 12px;
    cursor: pointer;
  }
  .rescount { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
  .nores { font-size: 14px; color: var(--ink-soft); font-style: italic; padding: 22px 0; text-align: center; }
  .sres {
    background: var(--paper-2);
    border: 1px solid var(--edge);
    border-radius: 3px;
    margin-bottom: 8px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .srow {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: none; border: none;
    padding: 12px 14px;
    font-family: inherit; color: var(--ink);
    cursor: pointer;
  }
  .srow .sg { font-size: 20px; flex: 0 1 auto; max-width: 50%; word-break: break-word; }
  .srow .sd { font-size: 13px; color: var(--ink-soft); flex: 1; text-align: right; }
  .sdot {
    flex: 0 0 10px; width: 10px; height: 10px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
  }
  .sdot.known { background: var(--gold); }
  .sdetail { padding: 0 14px 14px; font-size: 13px; line-height: 1.55; border-top: 1px dotted var(--edge); }
  .sdetail .sfull { font-size: 15px; margin-top: 10px; }
  .sdetail .snote { color: var(--ink-soft); font-style: italic; margin-top: 8px; }
  .sdetail .smeta { color: var(--ink-soft); font-size: 11px; letter-spacing: 0.06em; margin-top: 8px; }
  .stoggle {
    margin-top: 10px;
    font-family: inherit; font-size: 12px;
    padding: 7px 12px;
    border: 1px solid var(--edge);
    border-radius: 999px;
    background: none; color: var(--ink-soft);
    cursor: pointer;
  }

  /* ---- done screen ---- */
  .done { text-align: center; padding-top: 10px; }
  .done .big { font-size: 46px; margin: 10px 0 2px; }
  .done .big span { font-size: 20px; color: var(--ink-soft); }
  .missed { text-align: left; margin-top: 22px; border-top: 1px solid var(--edge); padding-top: 14px; }
  .mrow {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 9px 0; border-bottom: 1px dotted var(--edge);
    font-size: 14px;
  }
  .mrow .mg { font-size: 18px; }
  .mrow .md { color: var(--ink-soft); text-align: right; flex: 1; }

  /* ---- tests ---- */
  .tprog { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.04em; margin-bottom: 4px; }
  .bar.tbar { margin: 0 0 14px; }
  .qcard {
    background: var(--paper-2);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 16px 14px 14px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .qtype {
    display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-soft); margin-bottom: 10px;
  }
  .qtype span:last-child { text-transform: none; letter-spacing: 0; font-style: italic; font-size: 12px; text-align: right; }
  .qprompt { font-size: 17px; line-height: 1.5; margin-bottom: 14px; }
  .gk { font-size: 1.2em; }
  .qform { font-size: 30px; text-align: center; margin: 12px 0 4px; }
  .qprompt .qform { margin: 10px 0 6px; }
  .opt {
    display: block; width: 100%; text-align: left;
    padding: 12px 14px; margin-bottom: 8px;
    border: 1px solid var(--edge); border-radius: 3px;
    background: var(--paper); color: var(--ink);
    font-family: inherit; font-size: 16px; line-height: 1.4; cursor: pointer;
  }
  .opt:disabled { cursor: default; }
  .opt.sel { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .opt.ok { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .opt.no { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .opt .ck { display: inline-block; width: 1.5em; }
  .qinput {
    width: 100%; font-family: inherit; font-size: 20px;
    padding: 12px 14px; border: 1px solid var(--edge); border-radius: 3px;
    background: var(--paper); color: var(--ink);
  }
  .qinput:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .qinput.ok { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .qinput.no { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .pf { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .psel {
    display: block; width: 100%; margin-top: 4px;
    font-family: inherit; font-size: 16px; letter-spacing: 0; text-transform: none;
    padding: 10px 8px; border: 1px solid var(--edge); border-radius: 3px;
    background: var(--paper); color: var(--ink);
  }
  .psel.ok { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .psel.no { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .mnote { font-size: 12px; font-style: italic; color: var(--ink-soft); margin-bottom: 10px; min-height: 1em; }
  .mcols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mcol { display: flex; flex-direction: column; gap: 8px; }
  .mi {
    display: flex; align-items: center; gap: 8px; text-align: left;
    width: 100%; min-height: 48px; padding: 8px 10px;
    border: 1px solid var(--edge); border-radius: 3px;
    background: var(--paper); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.3; cursor: pointer;
  }
  .mi:disabled { cursor: default; }
  .mi.sel { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .mi.paired { background: var(--paper-2); border-color: var(--gold); }
  .mi.ok { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .mi.no { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .mi .nb {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
    background: var(--gold); color: var(--paper); font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .mi .mt { flex: 1; word-break: break-word; }
  .tileans {
    min-height: 56px; padding: 8px; margin-bottom: 12px;
    border: 1px dashed var(--edge); border-radius: 3px;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .tileans.ok { border-style: solid; border-color: var(--good); background: var(--good-bg); }
  .tileans.no { border-style: solid; border-color: var(--bad); background: var(--bad-bg); }
  .tilehint { font-size: 13px; font-style: italic; color: var(--ink-soft); padding-left: 4px; }
  .tilebank { display: flex; flex-wrap: wrap; gap: 8px; }
  .tile {
    font-family: inherit; font-size: 18px; padding: 9px 13px;
    border: 1px solid var(--edge); border-radius: 3px;
    background: var(--paper); color: var(--ink); cursor: pointer;
  }
  .tileans .tile { border-color: var(--gold); }
  .tile:disabled { cursor: default; }
  .fb { margin-top: 14px; padding: 12px 14px; border-radius: 3px; font-size: 14px; line-height: 1.55; border: 1px solid; }
  .fb.ok { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .fb.no { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .fbans { color: var(--ink); font-size: 17px; margin: 4px 0 6px; }
  .why { color: var(--ink-soft); font-size: 13px; margin-top: 6px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .rev { background: var(--paper-2); border: 1px solid var(--edge); border-radius: 3px; padding: 12px 14px; margin-bottom: 10px; }
  .rtopic { font-size: 12px; font-style: italic; color: var(--ink-soft); margin-bottom: 6px; }
  .rprompt { font-size: 15px; line-height: 1.45; }
  .rprompt .qform { font-size: 24px; margin: 6px 0; }
  .rans { font-size: 16px; color: var(--good); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="backBtn" style="display:none">&#8249;</button>
    <h1 id="hTitle">Koine Vocabulary</h1>
    <div class="sub" id="hSub">Basics of Biblical Greek</div>
  </header>
  <main id="main"></main>
</div>

<script>
(function () {
  "use strict";

  var DECKS = [
    {
      id: "ch4",
      name: "Chapter 4 — First Nouns",
      cards: [
        { g: "ἄγγελος", lex: "–ου, ὁ", d: "angel; messenger", f: 175, n: "The English 'angel' comes straight from this word." },
        { g: "ἀμήν", lex: "", d: "verily, truly, amen, so let it be", f: 128, n: "Transliterated directly into English as 'amen.'" },
        { g: "ἄνθρωπος", lex: "–ου, ὁ", d: "man; person, human being; people, mankind", f: 550, n: "Anthropology is the study of humans." },
        { g: "ἀπόστολος", lex: "–ου, ὁ", d: "apostle; envoy, messenger", f: 81, n: "" },
        { g: "Γαλιλαία", lex: "–ας, ἡ", d: "Galilee", f: 61, n: "" },
        { g: "γραφή", lex: "–ῆς, ἡ", d: "writing; Scripture", f: 50, n: "An autograph is a writing of one's own (αὐτός) name." },
        { g: "δόξα", lex: "–ης, ἡ", d: "glory, majesty, fame", f: 166, n: "A doxology is a 'word' (λόγος) of praise." },
        { g: "ἐγώ", lex: "", d: "I", f: 1800, n: "The 'ego' or self of a person. Frequency covers all singular forms." },
        { g: "ἔσχατος", lex: "–η, –ον", d: "last", f: 52, n: "Eschatology is the study of last things." },
        { g: "ζωή", lex: "–ῆς, ἡ", d: "life", f: 135, n: "Zoology is the study of animal life." },
        { g: "θεός", lex: "–οῦ, ὁ", d: "God, god", f: 1317, n: "Theology is the study of God." },
        { g: "καί", lex: "", d: "and; even, also; namely", f: 9162, n: "Triskaidekaphobia: 3 (τρεῖς) and (καί) 10 (δέκα)." },
        { g: "καρδία", lex: "–ας, ἡ", d: "heart; inner self", f: 156, n: "Cardiology is the study of the heart; the κ became a 'c' in English." },
        { g: "κόσμος", lex: "–ου, ὁ", d: "world, universe; mankind", f: 186, n: "Cosmology is the philosophical study of the universe." },

  // ---------- storage ----------
  var KEY = "koine.progress.v1";
  function loadProgress() {
    try {
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveProgress(p) {
    try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {}
  }
  var progress = loadProgress();

  // progress key for a card; a card with `same` shares its state with the earlier card it repeats
  function pk(deckId, c) {
    return c.same || (deckId + "|" + c.g);
  }

  function deckStats(deck) {
    var known = 0;
    for (var i = 0; i < deck.cards.length; i++) {
      if (progress[pk(deck.id, deck.cards[i])] === 1) known++;
    }
    return { known: known, total: deck.cards.length };
  }

  function overallStats() {
    var wordsKnown = 0, totalWords = 0, occKnown = 0;
    DECKS.forEach(function (d) {
      d.cards.forEach(function (c) {
        if (c.same) return; // repeat of a word already counted in an earlier chapter
        totalWords++;
        if (progress[pk(d.id, c)] === 1) {
          wordsKnown++;
          if (c.f) occKnown += c.f;
        }
      });
    });
    var pct = (occKnown / NT_TOTAL_WORDS) * 100;
    return { wordsKnown: wordsKnown, totalWords: totalWords, occKnown: occKnown, pct: pct };
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startDeck(d, onlyUnknown) {
    deck = d;
    var pool = d.cards.slice();
    if (onlyUnknown) {
      pool = pool.filter(function (c) { return progress[pk(d.id, c)] !== 1; });
      if (!pool.length) pool = d.cards.slice();
    }
    queue = shuffle(pool);
    idx = 0; flipped = false; hintShown = false;
    sessionRight = 0; sessionMissed = [];
    view = "study";
    backBtn.style.display = "block";
    hTitle.textContent = d.name.split(" — ")[0];
    hSub.textContent = d.name.split(" — ")[1] || "";
    renderStudy();
  }

  function QF(s) { return '<div class="qform">' + s + '</div>'; }

  // opts: { ph: placeholder, show: text to display as the answer, label: question-type label }
  function txt(prompt, answers, mode, why, opts) {
    opts = opts || {};
    return { t: "text", prompt: prompt, answers: answers, mode: mode, why: why, ph: opts.ph, show: opts.show || answers[0], label: opts.label };
  }
  function parse(form, ans, why) {
    return { t: "parse", prompt: "Parse this form.", form: form, ans: ans, why: why };

  function match(prompt, pairs, why) { return { t: "match", prompt: prompt, pairs: pairs, why: why }; }
  function L(q, label) { q.label = label; return q; }
  // answers: list of accepted tile sequences; bank: every tile offered (answer tiles plus distractors)

  // ---------- tests: engine ----------
  var TKEY = "koine.tests.v1";
  function loadTests() {
    try { var r = localStorage.getItem(TKEY); return r ? JSON.parse(r) : {}; } catch (e) { return {}; }
  }
  function saveTests(t) {
    try { localStorage.setItem(TKEY, JSON.stringify(t)); } catch (e) {}
  }
  var testStore = loadTests();
  var T = null; // the test run in progress

  var TYPE_LABEL = {
    mc: "Multiple choice", multi: "Select all that apply", text: "Type your answer",
    parse: "Parsing", match: "Connect", tiles: "Build it"
  };

  // English answers: ignore case, punctuation, articles, (sg)/(pl) notes, shall/will, he/she/it
  function normEn(s) {
    return String(s || "").toLowerCase()
      .replace(/\([^)]*\)/g, " ")
      .replace(/[’']ll\b/g, " will")
      .replace(/[^a-z\s]/g, " ")
      .replace(/\bshall\b/g, "will")
      .replace(/\b(the|a|an)\b/g, " ")
      .replace(/\b(he|she|it)\b(\s+(he|she|it)\b)*/g, "he")
      .replace(/\s+/g, " ").trim();
  }
  // Greek answers: accents, breathings and capitals do not matter
  function normGk(s) {
    return norm(s).replace(/[^α-ωa-z]/g, "");
  }

  function inst(v, slot) {
    var q = {};
    for (var k in v) q[k] = v[k];
    q.slot = slot.topic;
    if (v.t === "mc") q.options = shuffle([v.right].concat(v.wrongs));
    if (v.t === "multi") q.options = shuffle(v.rights.concat(v.wrongs));
    if (v.t === "match") {
      var order = [];
      for (var i = 0; i < v.pairs.length; i++) order.push(i);
      q.rightOrder = shuffle(order);
    }
    if (v.t === "tiles") q.bankOrder = shuffle(v.bank.map(function (b, i) { return i; }));
    return q;
  }

  // One question per slot. Within a slot every variant is used once before any repeats.
  function pickRun(test) {
    var st = testStore[test.id];
    if (!st) st = testStore[test.id] = { runs: 0, best: null, last: null, seen: {} };
    if (!st.seen) st.seen = {};
    var qs = [];
    test.slots.forEach(function (slot) {
      var n = slot.variants.length;
      var seen = (st.seen[slot.id] || []).filter(function (x) { return x < n; });
      var avail = [], i;
      for (i = 0; i < n; i++) if (seen.indexOf(i) < 0) avail.push(i);
      if (!avail.length) {
        var lastUsed = seen.length ? seen[seen.length - 1] : -1;
        seen = [];
        for (i = 0; i < n; i++) if (i !== lastUsed || n === 1) avail.push(i);
      }
      var pick = avail[Math.floor(Math.random() * avail.length)];
      seen.push(pick);
      st.seen[slot.id] = seen;
      qs.push(inst(slot.variants[pick], slot));
    });
    saveTests(testStore);
    return qs;
  }

  function newUi(q) {
    var u = { done: false, ok: false };
    if (q.t === "mc") u.sel = null;
    if (q.t === "multi") u.sel = [];
    if (q.t === "text") u.val = "";
    if (q.t === "parse") u.vals = [null, null, null, null];
    if (q.t === "match") { u.pairs = {}; u.selL = null; }
    if (q.t === "tiles") u.seq = [];
    return u;
  }

  function startTest(ti) {
    var test = TESTS[ti];
    mainTab = "tests";
    T = { ti: ti, test: test, qs: pickRun(test), i: 0, score: 0, results: [] };
    T.ui = newUi(T.qs[0]);
    view = "test";
    backBtn.style.display = "block";
    hTitle.textContent = test.short;
    hSub.textContent = test.sub;
    renderTest();
    window.scrollTo(0, 0);
  }

  function tileJoin(q) {
    return q.label === "Translation" ? " " : (q.label === "Put in order" ? " → " : "");
  }

  function canCheck(q, ui) {
    if (q.t === "mc") return ui.sel !== null;
    if (q.t === "multi") return ui.sel.length > 0;
    if (q.t === "text") return ui.val.trim() !== "";
    if (q.t === "parse") return ui.vals.every(function (v) { return v; });
    if (q.t === "match") return Object.keys(ui.pairs).length === q.pairs.length;
    if (q.t === "tiles") return ui.seq.length > 0;
    return false;
  }

  function grade(q, ui) {
    if (q.t === "mc") return ui.sel === q.right;
    if (q.t === "multi") {
      return ui.sel.length === q.rights.length && q.rights.every(function (r) { return ui.sel.indexOf(r) >= 0; });
    }
    if (q.t === "text") {
      var f = q.mode === "en" ? normEn : normGk;
      var g = f(ui.val);
      return g !== "" && q.answers.some(function (a) { return f(a) === g; });
    }
    if (q.t === "parse") return q.ans.every(function (a, i) { return ui.vals[i] === a; });
    if (q.t === "match") {
      return q.pairs.every(function (p, i) { return q.rightOrder[ui.pairs[i]] === i; });
    }
    if (q.t === "tiles") {
      var got = ui.seq.map(function (b) { return q.bank[b]; });
      return q.answers.some(function (a) {
        return a.length === got.length && a.every(function (x, i) { return x === got[i]; });
      });
    }
    return false;
  }

  function answerText(q) {
    if (q.t === "mc") return q.right;
    if (q.t === "multi") return q.rights.join("<br>");
    if (q.t === "text") return q.mode === "greek" ? '<span class="gk">' + q.show + '</span>' : q.show;
    if (q.t === "parse") return q.ans.join(" · ");
    if (q.t === "match") return q.pairs.map(function (p) { return p[0] + " → " + p[1]; }).join("<br>");
    if (q.t === "tiles") return q.answers[0].join(tileJoin(q));
    return "";
  }

  function qBody(q, ui) {
    var done = ui.done, h = "";
    if (q.t === "mc") {
      q.options.forEach(function (o, i) {
        var cls = "opt";
        if (done) cls += o === q.right ? " ok" : (ui.sel === o ? " no" : "");
        else if (ui.sel === o) cls += " sel";
        h += '<button class="' + cls + '" data-o="' + i + '"' + (done ? " disabled" : "") + '>' + o + '</button>';
      });
    } else if (q.t === "multi") {
      q.options.forEach(function (o, i) {
        var on = ui.sel.indexOf(o) >= 0, isRight = q.rights.indexOf(o) >= 0;
        var cls = "opt";
        if (done) cls += isRight ? " ok" : (on ? " no" : "");
        else if (on) cls += " sel";
        h += '<button class="' + cls + '" data-o="' + i + '"' + (done ? " disabled" : "") + '><span class="ck">' + (on ? "☑" : "☐") + '</span>' + o + '</button>';
      });
    } else if (q.t === "text") {
      var ph = q.ph || (q.mode === "greek" ? "Type in Greek (accents optional)" : "Type your answer");
      h += '<input type="text" class="qinput' + (done ? (ui.ok ? " ok" : " no") : "") + '" id="qin" value="' + esc(ui.val) + '" placeholder="' + esc(ph) + '"' +
        (done ? " readonly" : "") + ' autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" />';
    } else if (q.t === "parse") {
      h += QF(q.form) + '<div class="pgrid">';
      PARSE_FIELDS.forEach(function (f, fi) {
        var cls = "";
        if (done) cls = ui.vals[fi] === q.ans[fi] ? " ok" : " no";
        h += '<label class="pf"><span>' + f.k + '</span><select data-f="' + fi + '" class="psel' + cls + '"' + (done ? " disabled" : "") + '>' +
          '<option value="">—</option>';
        f.opts.forEach(function (o) {
          h += '<option value="' + o + '"' + (ui.vals[fi] === o ? " selected" : "") + '>' + o + '</option>';
        });
        h += '</select></label>';
      });
      h += '</div>';
    } else if (q.t === "match") {
      var pairedRight = {};
      Object.keys(ui.pairs).forEach(function (k) { pairedRight[ui.pairs[k]] = parseInt(k, 10); });
      h += '<div class="mnote">' + (done ? "" : "Tap an item on the left, then its match on the right. Tap a connected item to undo.") + '</div>';
      h += '<div class="mcols"><div class="mcol">';
      q.pairs.forEach(function (p, i) {
        var paired = ui.pairs[i] !== undefined;
        var cls = "mi" + (ui.selL === i ? " sel" : "") + (paired ? " paired" : "");
        if (done) cls += q.rightOrder[ui.pairs[i]] === i ? " ok" : " no";
        h += '<button class="' + cls + '" data-l="' + i + '"' + (done ? " disabled" : "") + '><span class="nb">' + (i + 1) + '</span><span class="mt">' + p[0] + '</span></button>';
      });
      h += '</div><div class="mcol">';
      q.rightOrder.forEach(function (orig, pos) {
        var k = pairedRight[pos];
        var cls = "mi" + (k !== undefined ? " paired" : "");
        if (done && k !== undefined) cls += k === orig ? " ok" : " no";
        h += '<button class="' + cls + '" data-r="' + pos + '"' + (done ? " disabled" : "") + '>' +
          (k !== undefined ? '<span class="nb">' + (k + 1) + '</span>' : '') + '<span class="mt">' + q.pairs[orig][1] + '</span></button>';
      });
      h += '</div></div>';
    } else if (q.t === "tiles") {
      h += '<div class="tileans' + (done ? (ui.ok ? " ok" : " no") : "") + '">';
      if (!ui.seq.length) h += '<span class="tilehint">Tap the pieces below</span>';
      ui.seq.forEach(function (b, si) {
        h += '<button class="tile" data-s="' + si + '"' + (done ? " disabled" : "") + '>' + esc(q.bank[b]) + '</button>';
      });
      h += '</div><div class="tilebank">';
      q.bankOrder.forEach(function (b) {
        if (ui.seq.indexOf(b) >= 0) return;
        h += '<button class="tile" data-b="' + b + '"' + (done ? " disabled" : "") + '>' + esc(q.bank[b]) + '</button>';
      });
      h += '</div>';
    }
    return h;
  }

  function feedbackHtml(q, ui) {
    var h = '<div class="fb ' + (ui.ok ? "ok" : "no") + '">';
    if (ui.ok) h += '<b>Correct.</b>';
    else h += '<b>Not quite.</b> The answer: <div class="fbans">' + answerText(q) + '</div>';
    if (q.why) h += '<div class="why">' + q.why + '</div>';
    return h + '</div>';
  }

  function renderTest() {
    var q = T.qs[T.i], ui = T.ui, done = ui.done;
    var label = q.label || TYPE_LABEL[q.t];
    var html = '<div class="tprog"><span>Question ' + (T.i + 1) + ' of ' + T.qs.length + '</span><span>' + T.score + ' correct</span></div>' +
      '<div class="bar tbar"><i style="width:' + Math.round((T.i / T.qs.length) * 100) + '%"></i></div>';
    html += '<div class="qcard"><div class="qtype"><span>' + label + '</span><span>' + q.slot + '</span></div>' +
      '<div class="qprompt">' + q.prompt + '</div>' + qBody(q, ui) + '</div>';
    if (done) html += feedbackHtml(q, ui);
    html += '<div class="actions" style="margin-top:14px">' +
      (done
        ? '<button class="btn solid" id="nextBtn">' + (T.i + 1 >= T.qs.length ? "See results" : "Next question") + '</button>'
        : '<button class="btn solid" id="checkBtn"' + (canCheck(q, ui) ? "" : " disabled") + '>Check answer</button>') +
      '</div>';
    main.innerHTML = html;
    bindQ(q, ui);
  }

  function bindQ(q, ui) {
    var checkBtn = document.getElementById("checkBtn");
    function refreshCheck() { if (checkBtn) checkBtn.disabled = !canCheck(q, ui); }
    function doCheck() {
      if (ui.done || !canCheck(q, ui)) return;
      ui.ok = grade(q, ui);
      ui.done = true;
      if (ui.ok) T.score++;
      T.results.push({ q: q, ok: ui.ok });
      renderTest();
    }
    function each(sel, fn) {
      Array.prototype.forEach.call(main.querySelectorAll(sel), fn);
    }

    if (checkBtn) checkBtn.addEventListener("click", doCheck);
    var nextBtn = document.getElementById("nextBtn");
    if (nextBtn) nextBtn.addEventListener("click", function () {
      T.i++;
      if (T.i >= T.qs.length) { renderTestDone(); }
      else { T.ui = newUi(T.qs[T.i]); renderTest(); }
      window.scrollTo(0, 0);
    });
    if (ui.done) return;

    if (q.t === "mc") {
      each(".opt", function (el) {
        el.addEventListener("click", function () {
          ui.sel = q.options[parseInt(el.getAttribute("data-o"), 10)];
          renderTest();
        });
      });
    } else if (q.t === "multi") {
      each(".opt", function (el) {
        el.addEventListener("click", function () {
          var o = q.options[parseInt(el.getAttribute("data-o"), 10)];
          var at = ui.sel.indexOf(o);
          if (at >= 0) ui.sel.splice(at, 1); else ui.sel.push(o);
          renderTest();
        });
      });
    } else if (q.t === "text") {
      var inp = document.getElementById("qin");
      inp.addEventListener("input", function () { ui.val = inp.value; refreshCheck(); });
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doCheck(); } });
    } else if (q.t === "parse") {
      each(".psel", function (el) {
        el.addEventListener("change", function () {
          ui.vals[parseInt(el.getAttribute("data-f"), 10)] = el.value || null;
          refreshCheck();
        });
      });
    } else if (q.t === "match") {
      each("[data-l]", function (el) {
        el.addEventListener("click", function () {
          var i = parseInt(el.getAttribute("data-l"), 10);
          if (ui.pairs[i] !== undefined) { delete ui.pairs[i]; ui.selL = i; }
          else ui.selL = ui.selL === i ? null : i;
          renderTest();
        });
      });
      each("[data-r]", function (el) {
        el.addEventListener("click", function () {
          var pos = parseInt(el.getAttribute("data-r"), 10), owner;
          Object.keys(ui.pairs).forEach(function (k) { if (ui.pairs[k] === pos) owner = k; });
          if (ui.selL === null) {
            if (owner !== undefined) delete ui.pairs[owner];
          } else {
            if (owner !== undefined) delete ui.pairs[owner];
            ui.pairs[ui.selL] = pos;
            ui.selL = null;
          }
          renderTest();
        });
      });
    } else if (q.t === "tiles") {
      each("[data-b]", function (el) {
        el.addEventListener("click", function () {
          ui.seq.push(parseInt(el.getAttribute("data-b"), 10));
          renderTest();
        });
      });
      each("[data-s]", function (el) {
        el.addEventListener("click", function () {
          ui.seq.splice(parseInt(el.getAttribute("data-s"), 10), 1);
          renderTest();
        });
      });
    }
  }

  function renderTestDone() {
    var total = T.qs.length, pct = Math.round((T.score / total) * 100);
    var st = testStore[T.test.id] || (testStore[T.test.id] = { runs: 0, best: null, last: null, seen: {} });
    st.runs = (st.runs || 0) + 1;
    st.last = pct;
    st.best = st.best === null || st.best === undefined ? pct : Math.max(st.best, pct);
    saveTests(testStore);

    var html = '<div class="done"><div class="big">' + T.score + '<span> / ' + total + '</span></div>' +
      '<div style="color:var(--ink-soft); font-size:13px; font-style:italic;">' + pct + '% correct on ' + T.test.short + '</div></div>';

    var missed = T.results.filter(function (r) { return !r.ok; });
    if (missed.length) {
      html += '<div class="section-label">Review what you missed</div>';
      missed.forEach(function (r) {
        html += '<div class="rev"><div class="rtopic">' + r.q.slot + '</div><div class="rprompt">' + r.q.prompt + '</div>' +
          '<div class="rans">' + answerText(r.q) + '</div>' + (r.q.why ? '<div class="why">' + r.q.why + '</div>' : '') + '</div>';
      });
    } else {
      html += '<div class="nores">A perfect round. Retake for a fresh mix of questions on the same topics.</div>';
    }
    html += '<div class="actions" style="margin-top:20px"><button class="btn solid" id="retakeBtn">Retake with new questions</button></div>' +
      '<div class="toolbar"><button id="testsHome">Back to tests</button></div>';
    main.innerHTML = html;
    document.getElementById("retakeBtn").addEventListener("click", function () { startTest(T.ti); });
    document.getElementById("testsHome").addEventListener("click", goHome);
  }

  function renderTests() {
    var html = renderTabs();
    html += '<div class="section-label">Chapter tests</div>';
    html += '<div class="chart-note" style="margin-bottom:14px">Each test covers the same topics every time. The questions rotate through different types (multiple choice, connect, build, type-in, parsing, translation) so a retake is a fresh mix. No vocabulary questions.</div>';
    TESTS.forEach(function (t, i) {
      var st = testStore[t.id] || {};
      html += '<button class="deck" data-t="' + i + '">' +
        '<div class="dt">' + t.name + '</div>' +
        '<div class="dm"><span>' + t.slots.length + ' questions</span><span>' +
        (st.runs ? "Last " + st.last + "% · Best " + st.best + "%" : "Not taken yet") + '</span></div></button>';
    });
    main.innerHTML = html;
    bindTabs();
    Array.prototype.forEach.call(main.querySelectorAll("[data-t]"), function (el) {
      el.addEventListener("click", function () { startTest(parseInt(el.getAttribute("data-t"), 10)); });
    });
  }


  // ---------- views ----------
  function renderTabs() {
    return '<div class="tabs">' +
      '<button class="tabbtn' + (mainTab === "decks" ? " active" : "") + '" id="tabDecks">Flashcards</button>' +
      '<button class="tabbtn' + (mainTab === "charts" ? " active" : "") + '" id="tabCharts">Grammar Charts</button>' +
      '<button class="tabbtn' + (mainTab === "tests" ? " active" : "") + '" id="tabTests">Tests</button>' +
      '</div>';
  }

  function bindTabs() {
    document.getElementById("tabDecks").addEventListener("click", function () {
      mainTab = "decks";
      renderHome();
    });
    document.getElementById("tabCharts").addEventListener("click", function () {
      mainTab = "charts";
      renderHome();
    });
    document.getElementById("tabTests").addEventListener("click", function () {
      mainTab = "tests";
      renderHome();
    });
  }

  // ---------- search ----------
  var searchIndex = null;
  var lastShown = [];
  var progressDirty = false;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // lowercase, strip Greek accents/breathings/apostrophes, fold final sigma
  function norm(s) {
    return String(s || "").normalize("NFD")
      .replace(/[̀-ͯ᾽᾿’']/g, "")
      .replace(/ς/g, "σ")
      .toLowerCase();
  }

  function buildIndex() {
    searchIndex = [];
    DECKS.forEach(function (d) {
      d.cards.forEach(function (c) {
        searchIndex.push({
          card: c, deck: d,
          g: norm(c.g), d: norm(c.d),
          all: norm([c.g, c.lex, c.d, c.pp, c.n].join(" "))
        });
      });
    });
  }

  function runSearch(q) {
    var nq = norm(q).trim();
    if (!nq) return [];
    if (!searchIndex) buildIndex();
    var terms = nq.split(/\s+/);
    var out = [];
    searchIndex.forEach(function (e, i) {
      for (var t = 0; t < terms.length; t++) {
        if (e.all.indexOf(terms[t]) === -1) return;
      }
      var score = 0;
      if (e.g.indexOf(nq) === 0) score = 4;
      else if (e.g.indexOf(nq) !== -1) score = 3;
      else if (e.d.indexOf(nq) !== -1) score = 2;
      else if (e.d.indexOf(terms[0]) !== -1) score = 1;
      out.push({ e: e, score: score, i: i });
    });
    out.sort(function (a, b) { return b.score - a.score || a.i - b.i; });
    return out;
  }

  function renderResults(box, q) {
    var res = runSearch(q);
    if (!res.length) {
      lastShown = [];
      box.innerHTML = '<div class="nores">No vocabulary matches “' + esc(q.trim()) + '”.</div>';
      return;
    }
    lastShown = res.slice(0, 50);
    var html = '<div class="rescount">' + res.length + (res.length === 1 ? ' word' : ' words') +
      (res.length > lastShown.length ? ' — showing the first ' + lastShown.length : '') + '</div>';
    lastShown.forEach(function (r, k) {
      var c = r.e.card, d = r.e.deck;
      var known = progress[pk(d.id, c)] === 1;
      html += '<div class="sres">' +
        '<button class="srow" data-k="' + k + '" aria-expanded="false">' +
          '<span class="sg">' + esc(c.g) + '</span>' +
          '<span class="sd">' + esc(c.d) + '</span>' +
          '<span class="sdot ' + (known ? 'known' : '') + '" role="img" aria-label="' + (known ? 'marked known' : 'not yet known') + '"></span>' +
        '</button>' +
        '<div class="sdetail" hidden>' +
          '<div class="sfull">' + esc(c.g) + (c.lex ? ' <span style="color:var(--ink-soft)">' + esc(c.lex) + '</span>' : '') + ' — ' + esc(c.d) + '</div>' +
          (c.pp ? '<div class="snote" style="font-style:normal">Principal parts: ' + esc(c.pp) + '</div>' : '') +
          (c.n ? '<div class="snote">' + esc(c.n) + '</div>' : '') +
          '<div class="smeta">' + esc(d.name) + (c.f ? ' · ' + c.f.toLocaleString() + ' occurrences in the NT' : '') + '</div>' +
          '<button class="stoggle" data-k="' + k + '">' + (known ? 'Mark as not known' : 'Mark as known') + '</button>' +
        '</div>' +
      '</div>';
    });
    box.innerHTML = html;
  }

  function bindSearch() {
    var si = document.getElementById("searchInput");
    var sb = document.getElementById("searchResults");
    var hb = document.getElementById("homeBody");
    var sc = document.getElementById("searchClear");
    if (!si || !sb || !hb || !sc) return;

    function update() {
      var q = si.value;
      if (!q.trim()) {
        if (progressDirty) {
          progressDirty = false;
          renderHome();
          var ni = document.getElementById("searchInput");
          if (ni) ni.focus();
          return;
        }
        sb.style.display = "none"; sb.innerHTML = "";
        hb.style.display = ""; sc.style.display = "none";
        return;
      }
      hb.style.display = "none"; sb.style.display = ""; sc.style.display = "";
      renderResults(sb, q);
    }

    si.addEventListener("input", update);
    sc.addEventListener("click", function () {
      si.value = "";
      update();
      si.focus();
    });

    sb.addEventListener("click", function (ev) {
      var tog = ev.target.closest(".stoggle");
      if (tog) {
        var r = lastShown[parseInt(tog.getAttribute("data-k"), 10)];
        if (!r) return;
        var key = pk(r.e.deck.id, r.e.card);
        progress[key] = progress[key] === 1 ? 0 : 1;
        saveProgress(progress);
        progressDirty = true;
        var isKnown = progress[key] === 1;
        var wrap = tog.closest(".sres");
        var dot = wrap.querySelector(".sdot");
        dot.className = "sdot" + (isKnown ? " known" : "");
        dot.setAttribute("aria-label", isKnown ? "marked known" : "not yet known");
        tog.textContent = isKnown ? "Mark as not known" : "Mark as known";
        return;
      }
      var row = ev.target.closest(".srow");
      if (row) {
        var det = row.parentNode.querySelector(".sdetail");
        var opening = det.hasAttribute("hidden");
        if (opening) det.removeAttribute("hidden"); else det.setAttribute("hidden", "");
        row.setAttribute("aria-expanded", opening ? "true" : "false");
      }
    });
  }

  function renderHome() {
    if (mainTab === "charts") return renderCharts();
    if (mainTab === "tests") return renderTests();

    var allCount = 0;
    DECKS.forEach(function (d) {
      d.cards.forEach(function (c) { if (!c.same) allCount++; });
    });
    var os = overallStats();
    var pctDisplay = os.pct >= 10 ? os.pct.toFixed(1) : os.pct.toFixed(2);

    var html = renderTabs();

    html += '<div class="searchbox">' +
      '<input type="search" id="searchInput" placeholder="Search Greek or English…" aria-label="Search vocabulary" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search" />' +
      '<button class="sclear" id="searchClear" aria-label="Clear search" style="display:none">×</button>' +
      '</div>';

    html += '<div id="homeBody">';

    html += '<div class="overall">' +
      '<div class="ot">Overall progress</div>' +
      '<div class="orow"><span class="opct">' + pctDisplay + '%</span>' +
      '<span class="owords">of the New Testament<br>' + os.wordsKnown + ' of ' + os.totalWords + ' words memorized</span></div>' +
      '<div class="bar"><i style="width:' + Math.min(100, os.pct) + '%"></i></div>' +
      '</div>';

    html += '<button class="deck" data-all="1">' +
      '<div class="dt">Study everything</div>' +
      '<div class="dm"><span>All chapters shuffled together</span><span>' + allCount + ' cards</span></div>' +
      '</button>';

    var unknownCount = os.totalWords - os.wordsKnown;
    html += '<button class="deck" data-unknown="1"' + (unknownCount === 0 ? ' disabled style="opacity:0.55;cursor:default"' : '') + '>' +
      '<div class="dt">Test what I don’t know yet</div>' +
      '<div class="dm"><span>' + (unknownCount === 0 ? 'Every word is marked known' : 'Only cards not marked “Got it”, from every chapter') + '</span><span>' + unknownCount + ' cards</span></div>' +
      '</button>';

    html += '<div class="section-label">By chapter</div>';

    DECKS.forEach(function (d, i) {
      var s = deckStats(d);
      var pct = s.total ? Math.round((s.known / s.total) * 100) : 0;
      html += '<button class="deck" data-i="' + i + '">' +
        '<div class="dt">' + d.name + '</div>' +
        '<div class="dm"><span>' + s.known + ' of ' + s.total + ' known</span><span>' + s.total + ' cards</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '</button>';
    });

    html += '<div class="toolbar"><button id="resetAll">Reset all progress</button></div>';
    html += '</div><div id="searchResults" style="display:none"></div>';
    main.innerHTML = html;

    bindTabs();
    bindSearch();

    Array.prototype.forEach.call(main.querySelectorAll(".deck"), function (el) {
      el.addEventListener("click", function () {
        if (el.getAttribute("data-unknown")) {
          var unknown = [];
          DECKS.forEach(function (d) {
            d.cards.forEach(function (c) {
              if (!c.same && progress[d.id + "|" + c.g] !== 1) {
                var copy = {};
                for (var k in c) copy[k] = c[k];
                copy.__deck = d.id;
                unknown.push(copy);
              }
            });
          });
          if (!unknown.length) return;
          startDeck({ id: "__unknown", name: "Not Yet Known — Cards still to learn", cards: unknown }, false);
        } else if (el.getAttribute("data-all")) {
          var merged = [];
          DECKS.forEach(function (d) {
            d.cards.forEach(function (c) {
              if (c.same) return;
              var copy = {};
              for (var k in c) copy[k] = c[k];
              copy.__deck = d.id;
              merged.push(copy);
            });
          });
          startDeck({ id: "__all", name: "All Chapters — Full review", cards: merged }, false);
        } else {
          startDeck(DECKS[parseInt(el.getAttribute("data-i"), 10)], false);
        }
      });
    });

    var reset = document.getElementById("resetAll");
    if (reset) reset.addEventListener("click", function () {
      progress = {};
      saveProgress(progress);
      renderHome();
    });
  }

  function renderCharts() {
    var html = renderTabs();
    html += '<div class="section-label">Reference paradigms</div>';

    CHARTS.forEach(function (chart) {
      html += '<div class="chart-block">' +
        '<div class="chart-title">' + chart.title + '</div>' +
        '<div class="chart-note">' + chart.note + '</div>' +
        '<table class="paradigm"><thead><tr>';
      chart.headers.forEach(function (h, hi) {
        html += '<th' + (hi === 0 ? ' class="rowlabel"' : '') + '>' + (h === "" ? "&nbsp;" : h) + '</th>';
      });
      html += '</tr></thead><tbody>';
      chart.rows.forEach(function (row) {
        html += '<tr>';
        row.forEach(function (cell, ci) {
          html += ci === 0
            ? '<td class="rowlabel">' + cell + '</td>'
            : '<td class="greekcell">' + cell + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    });

    main.innerHTML = html;
    bindTabs();
  }

  function keyFor(card) {
    return card.same || ((card.__deck || deck.id) + "|" + card.g);
  }

  function renderStudy() {
    if (idx >= queue.length) return renderDone();
    var c = queue[idx];
    var known = progress[keyFor(c)] === 1;

    var html = '<div class="meta">' +
      '<span>' + (idx + 1) + ' / ' + queue.length + '</span>' +
      '<span>' + (known ? "marked known" : "") + '</span>' +
      '</div>' +
      '<div class="scene"><div class="card" id="card">' +
        '<div class="face front">' +
          '<div class="greek">' + c.g + '</div>' +
          (c.lex ? '<div class="lexform">' + c.lex + '</div>' : '') +
          (c.n ? '<button class="hintbtn" id="hintBtn">Hint</button>' : '') +
          '<div class="hinttext" id="hintText" style="display:none"></div>' +
          '<div class="tapnote">tap to reveal</div>' +
        '</div>' +
        '<div class="face back">' +
          '<div class="def">' + c.d + '</div>' +
          (c.pp ? '<div class="pp">Principal parts: ' + c.pp + '</div>' : '') +
          (c.n ? '<div class="note">' + c.n + '</div>' : '') +
          (c.f ? '<div class="freq">' + c.f.toLocaleString() + ' occurrences in the NT</div>' : '') +
        '</div>' +
      '</div></div>' +
      '<div class="actions">' +
        '<button class="btn bad" id="againBtn">Review again</button>' +
        '<button class="btn good" id="gotBtn">Got it</button>' +
      '</div>' +
      '<div class="toolbar"><button id="shuffleBtn">Reshuffle deck</button><button id="restartBtn">Restart deck</button></div>';

    main.innerHTML = html;

    var cardEl = document.getElementById("card");
    flipped = false; hintShown = false;
    cardEl.addEventListener("click", function () {
      flipped = !flipped;
      cardEl.classList.toggle("flipped", flipped);
    });

    var hintBtn = document.getElementById("hintBtn");
    if (hintBtn) {
      hintBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var ht = document.getElementById("hintText");
        if (!hintShown) {
          ht.textContent = c.n;
          ht.style.display = "block";
          hintBtn.style.display = "none";
          hintShown = true;
        }
      });
    }

    document.getElementById("gotBtn").addEventListener("click", function () {
      progress[keyFor(c)] = 1;
      saveProgress(progress);
      sessionRight++;
      idx++;
      renderStudy();
    });
    document.getElementById("againBtn").addEventListener("click", function () {
      progress[keyFor(c)] = 0;
      saveProgress(progress);
      sessionMissed.push(c);
      idx++;
      renderStudy();
    });
    document.getElementById("shuffleBtn").addEventListener("click", function () {
      queue = shuffle(queue.slice(idx));
      idx = 0;
      renderStudy();
    });
    document.getElementById("restartBtn").addEventListener("click", function () {
      queue = deck.cards.slice();
      idx = 0; sessionRight = 0; sessionMissed = [];
      renderStudy();
    });
  }

  function renderDone() {
    var total = queue.length;
    var html = '<div class="done">' +
      '<div class="big">' + sessionRight + '<span> / ' + total + '</span></div>' +
      '<div style="color:var(--ink-soft); font-size:13px; font-style:italic;">cards marked known this round</div>';

    if (sessionMissed.length) {
      html += '<div class="missed"><div class="section-label" style="margin-top:0">Come back to these</div>';
      sessionMissed.forEach(function (c) {
        html += '<div class="mrow"><div class="mg">' + c.g + '</div><div class="md">' + c.d + '</div></div>';
      });
      html += '</div>';
    }

    html += '<div class="actions" style="margin-top:22px">' +
      (sessionMissed.length ? '<button class="btn" id="drillBtn">Drill missed</button>' : '') +
      '<button class="btn solid" id="againDeck">Run deck again</button>' +
      '</div>' +
      '<div class="toolbar"><button id="homeBtn">Back to all decks</button></div></div>';

    main.innerHTML = html;

    var drill = document.getElementById("drillBtn");
    if (drill) drill.addEventListener("click", function () {
      queue = shuffle(sessionMissed.slice());
      idx = 0; sessionRight = 0; sessionMissed = [];
      renderStudy();
    });
    document.getElementById("againDeck").addEventListener("click", function () {
      queue = deck.cards.slice();
      idx = 0; sessionRight = 0; sessionMissed = [];
      renderStudy();
    });
    document.getElementById("homeBtn").addEventListener("click", goHome);
  }

  goHome();
})();

// Offline support when the page is served as a website (does nothing elsewhere)
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  });
}
</script>
</body>
</html>
